{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <h1 class="text-2xl font-bold mb-2">Welcome Back</h1>
        <p class="text-sm text-gray-500 mb-6">Log in to track your orders and checkout faster.</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            <input type="email" name="email" placeholder="Email Address" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[var(--primary-color)]">
            <input type="password" name="password" placeholder="Password" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[var(--primary-color)]">
            <button type="submit" class="w-full bg-[var(--primary-color)] text-white py-3 rounded-lg font-bold hover:opacity-90 transition">Log In</button>
        </form>

        <p class="text-sm text-center mt-6 text-gray-500">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-[var(--primary-color)] font-semibold">Sign up</a></p>
    </div>
</div>
{% endblock %}
