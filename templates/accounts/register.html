{% extends 'base.html' %}
{% block title %}Create Account{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <h1 class="text-2xl font-bold mb-2">Create Your Account</h1>
        <p class="text-sm text-gray-500 mb-6">Join {{ store.store_name }} to track orders and checkout faster.</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <input type="text" name="full_name" placeholder="Full Name" value="{{ form_data.full_name|default:'' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[var(--primary-color)]">
            <input type="email" name="email" placeholder="Email Address" value="{{ form_data.email|default:'' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[var(--primary-color)]">
            <input type="text" name="phone" placeholder="Phone Number" value="{{ form_data.phone|default:'' }}" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[var(--primary-color)]">
            <input type="password" name="password" placeholder="Password (min 6 chars)" required minlength="6" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[var(--primary-color)]">
            <input type="password" name="password2" placeholder="Confirm Password" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[var(--primary-color)]">
            <button type="submit" class="w-full bg-[var(--primary-color)] text-white py-3 rounded-lg font-bold hover:opacity-90 transition">Create Account</button>
        </form>

        <p class="text-sm text-center mt-6 text-gray-500">Already have an account? <a href="{% url 'accounts:login' %}" class="text-[var(--primary-color)] font-semibold">Log in</a></p>
    </div>
</div>
{% endblock %}
