<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,sans-serif;">
<div style="max-width:600px;margin:0 auto;padding:24px;">

    <div style="background:{{ store.secondary_color }};padding:24px;text-align:center;border-radius:12px 12px 0 0;">
        <h1 style="color:white;margin:0;font-size:22px;">Your order is on the way!</h1>
    </div>

    <div style="background:white;padding:32px;border-radius:0 0 12px 12px;">
        <p style="color:#4b5563;line-height:1.6;">
            Great news! Order <strong>{{ order.order_number }}</strong> has been shipped.
        </p>

        <div style="background:#f9fafb;padding:16px;border-radius:8px;margin:24px 0;">
            <p style="margin:0;color:#6b7280;font-size:12px;text-transform:uppercase;">Delivery Method</p>
            <p style="margin:4px 0 0;color:#111827;font-weight:bold;">{{ order.delivery_method.name }}</p>

            {% if order.address %}
            <p style="margin:12px 0 0;color:#6b7280;font-size:12px;text-transform:uppercase;">Delivering to</p>
            <p style="margin:4px 0 0;color:#111827;">{{ order.address }}, {{ order.city }}, {{ order.state }}</p>
            {% endif %}
        </div>

        <p style="margin-top:32px;color:#9ca3af;font-size:12px;text-align:center;">
            Contact us at {{ store.contact_email }}
        </p>
    </div>
</div>
</body>
</html>
