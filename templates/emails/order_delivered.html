<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,sans-serif;">
<div style="max-width:600px;margin:0 auto;padding:24px;">

    <div style="background:#10b981;padding:32px;text-align:center;border-radius:12px 12px 0 0;">
        <div style="color:white;font-size:40px;margin-bottom:8px;">🎉</div>
        <h1 style="color:white;margin:0;font-size:24px;">Delivered!</h1>
    </div>

    <div style="background:white;padding:32px;border-radius:0 0 12px 12px;">
        <p style="color:#4b5563;line-height:1.6;">
            Your order <strong>{{ order.order_number }}</strong> has been delivered. We hope you love it!
        </p>

        <p style="color:#4b5563;">
            If you have a moment, we'd love to hear your feedback.
        </p>

        <p style="margin-top:32px;color:#9ca3af;font-size:12px;text-align:center;">
            Thank you for shopping with {{ store.store_name }}
        </p>
    </div>
</div>
</body>
</html>
