<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#F8FAFC;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
<div style="max-width:600px;margin:0 auto;padding:32px 16px;">

    <!-- Header -->
    <div style="background:{{ store.primary_color }};padding:40px 24px;text-align:center;border-radius:16px 16px 0 0;">
        <h1 style="color:white;margin:0;font-family:Georgia,serif;font-size:28px;font-weight:normal;letter-spacing:-0.5px;">Delivered</h1>
    </div>

    <!-- Body Card -->
    <div style="background:white;padding:40px 32px;border-radius:0 0 16px 16px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);">
        
        <p style="color:#4B5563;font-size:16px;line-height:1.6;margin:0 0 20px 0;">
            Your order <strong style="color:#111827;">{{ order.order_number }}</strong> has been delivered. We hope you love it!
        </p>

        <p style="color:#4B5563;font-size:16px;line-height:1.6;margin:0 0 32px 0;">
            If you have a moment, we'd love to hear your feedback.
        </p>

        <!-- Footer -->
        <p style="margin:40px 0 0 0;color:#9CA3AF;font-size:12px;text-align:center;letter-spacing:0.5px;">
            Thank you for shopping with {{ store.store_name }}
        </p>
        
    </div>
</div>
</body>
</html>
