{% extends 'base.html' %}
{% block title %}Order {{ order.order_number }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-16 text-center">
    <h1 class="text-2xl font-bold mb-2">Order {{ order.order_number }}</h1>
    <p class="text-gray-500 mb-6">Status: <strong>{{ order.get_status_display }}</strong></p>
    <p class="text-sm text-gray-500 mb-8">Log in to view full details, or use the tracking page.</p>
    <a href="{% url 'accounts:login' %}?next={% url 'orders:detail' order.order_number %}" class="bg-[var(--primary-color)] text-white px-6 py-3 rounded-lg font-semibold hover:opacity-90 transition">Log In to View</a>
</div>
{% endblock %}
